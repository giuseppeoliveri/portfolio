<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Giuseppe Oliveri</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Stile personalizzato -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-dark text-white">

  <!-- HEADER CENTRATO -->
  <header class="position-fixed top-0 start-0 w-100 text-center py-4 z-3">
    <div class="dropdown d-inline-block">
      <!-- data-bs-display="static" evita che Popper ri-posizioni con offset automatici -->
      <div class="dropdown d-inline-block">
        <button
          id="mainDropdownBtn"
          class="btn btn-white text-dark rounded-pill px-4 py-2 glow-btn dropdown-toggle"
          type="button"
          data-bs-toggle="dropdown"
          aria-expanded="false"
          style="--glow: #00ff00; background: #fff; color: #000; border: none;">
          Giuseppe Oliveri
        </button>
        <ul class="dropdown-menu border-0 p-0 mt-2 w-100" style="min-width:0;">
          <li><a class="dropdown-item rounded-pill px-4 py-2 mb-2" href="mailto:giuseppe@example.com">Mail</a></li>
          <li><a class="dropdown-item rounded-pill px-4 py-2 mb-2" href="https://www.instagram.com/giuseppe_oli_/" target="_blank">Instagram</a></li>
          <li><a class="dropdown-item rounded-pill px-4 py-2" href="about.html">About</a></li>
        </ul>
      </div>
    </div>
  </header>

  <!-- FULLSCREEN CAROUSEL -->
  <main class="vh-100 vw-100 overflow-hidden d-flex justify-content-center align-items-center">
    <div id="fullscreenCarousel" class="carousel slide carousel-fade w-100 h-100" data-bs-ride="carousel">
      <div class="carousel-inner"></div>
    </div>
  </main>

  <!-- Footer player audio -->
  <footer class="position-fixed bottom-0 start-50 translate-middle-x" style="z-index:1050; background:transparent; border:none; padding:0; width:auto; height:auto;">
    <iframe id="spotifyWidget" style="border-radius:18px; box-shadow:0 4px 24px rgba(0,0,0,0.18); border:none; background:transparent; width:380px; height:100px;" src="https://open.spotify.com/embed/playlist/6v1JmBQ4eN8b2r3zie3Mhn?utm_source=generator" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
  </footer>
  <style>
    @media (max-width: 600px) {
      footer {
        right: 8px !important;
        bottom: 8px !important;
      }
      #spotifyWidget {
        width: 98vw !important;
        min-width: 0 !important;
        height: 80px !important;
        border-radius: 12px !important;
      }
    }
    @media (max-width: 400px) {
      #spotifyWidget {
        width: 96vw !important;
        height: 70px !important;
      }
    }
  </style>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Script personalizzato -->
  <script src="script.js"></script>
</body>
</html>
