<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Giuseppe Oliveri</title>

  <meta name="description" content="Portfolio di Giuseppe Oliveri - Graphic Designer e Illustratore" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body class="homepage">

  <!-- Theme Toggle Button -->
  <div id="themeToggleBtn">
    <svg id="lightbulbIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2a5 5 0 0 0-5 5c0 1.95 2 3.69 2 5.5V14a3 3 0 0 0 6 0v-1.5c0-1.81 2-3.55 2-5.5a5 5 0 0 0-5-5z"></path>
      <line x1="9" y1="18" x2="15" y2="18"></line>
      <line x1="10" y1="22" x2="14" y2="22"></line>
    </svg>
  </div>

  <!-- Online Counter / Views -->
  <div id="onlineCounter">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#28a745"
      stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="blinking-icon">
      <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
      <circle cx="12" cy="12" r="3"></circle>
    </svg>
    <span id="onlineCountNumber" class="fw-bold"></span>
    <span class="counter-hover-text">monthly views</span>
  </div>
  <div id="counterTapLabel">monthly views</div>

  <header class="position-fixed top-0 start-0 w-100 py-3">
    <div class="container text-center">
      <nav class="pill-nav d-inline-flex position-relative">
        <div class="nav-background"></div>
        <a href="#" class="pill-nav-item active">Giuseppe Oliveri</a>
        <a href="#" class="pill-nav-item" data-bs-toggle="modal" data-bs-target="#projectsModal">
          <i data-feather="grid"></i>
        </a>
        <a href="mailto:giuseppe.oliveri99@gmail.com" class="pill-nav-item">
          <i data-feather="mail"></i>
        </a>
        <a href="https://www.instagram.com/giuseppe_oli_/" target="_blank" rel="noopener noreferrer"
          class="pill-nav-item">
          <i data-feather="instagram"></i>
        </a>
        <a href="#" class="pill-nav-item" id="aboutToggle">
          <i data-feather="info"></i>
        </a>
      </nav>


    </div>
  </header>

  <main class="vh-100 vw-100 overflow-hidden d-flex justify-content-center align-items-center">
    <div id="fullscreenCarousel" class="carousel slide carousel-fade w-100 h-100" data-bs-interval="false">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <video src="immagini/Aria Auditorium Mascotte.mp4" class="d-block w-100" style="background-color: #000;" muted
            playsinline autoplay loop></video>
        </div>
        <div class="carousel-item">
          <video src="immagini/Olivetti posters animation.mp4" class="d-block w-100" style="background-color: #000;"
            muted playsinline autoplay loop></video>
        </div>
        <div class="carousel-item">
          <video src="immagini/Sergio Ruffolo Book Desktop.mp4" class="d-none d-md-block w-100"
            style="background-color: #000;" muted playsinline autoplay loop></video>
          <video src="immagini/Sergio Ruffolo Book.mp4" class="d-block d-md-none w-100" style="background-color: #000;"
            muted playsinline autoplay loop></video>
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#fullscreenCarousel" data-bs-slide="prev">
        <i data-feather="chevron-left" class="carousel-control-prev-icon-custom"></i>
        <span class="visually-hidden">Previous</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#fullscreenCarousel" data-bs-slide="next">
        <i data-feather="chevron-right" class="carousel-control-next-icon-custom"></i>
        <span class="visually-hidden">Next</span>
      </button>
    </div>

    <!-- File Name Display -->
    <div id="fileDisplay" class="file-display"></div>
  </main>

  <div class="modal fade" id="projectsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-fullscreen">
      <div class="modal-content about-modal-content">
        <div class="modal-body p-0 overflow-auto"> <!-- Allow scrolling -->

          <header class="position-fixed top-0 start-0 w-100 py-3" style="z-index: 1040;">
            <div class="container text-center">
              <nav class="pill-nav d-inline-flex position-relative">
                <div class="nav-background"></div>
                <a href="#" class="pill-nav-item" data-bs-dismiss="modal">Giuseppe Oliveri</a>
                <a href="#" class="pill-nav-item active" data-bs-dismiss="modal">
                  <i data-feather="grid"></i>
                </a>
                <a href="mailto:giuseppe@example.com" class="pill-nav-item">
                  <i data-feather="mail"></i>
                </a>
                <a href="https://www.instagram.com/giuseppe_oli_/" target="_blank" rel="noopener noreferrer"
                  class="pill-nav-item">
                  <i data-feather="instagram"></i>
                </a>
                <a href="#" class="pill-nav-item" id="aboutToggleModal">
                  <i data-feather="info"></i>
                </a>
              </nav>
            </div>
          </header>

          <div class="container d-flex flex-column align-items-center justify-content-start min-vh-100 pt-5 pb-5">
            <div class="mt-5 pt-5 text-center w-100">
              <!-- Filter Nav -->
              <nav class="pill-nav d-inline-flex position-relative mb-4 flex-wrap" id="categoryFilterNav"
                style="z-index: 10;">
                <div class="nav-background"></div>
                <!-- Buttons will be generated by JS -->
              </nav>
            </div>
            <div class="col-lg-10 w-100" id="projectsGridContainer">
              <!-- Grid dynamically populated by JS -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Project Details Modal (Extra Info) -->
  <div class="modal fade" id="projectDetailsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content about-modal-content"
        style="border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);">
        <div class="modal-header border-0 pb-0 justify-content-end position-absolute w-100" style="z-index: 10;">
          <button type="button" class="btn-close btn-close-white m-3" data-bs-dismiss="modal" aria-label="Close"
            style="background-color: rgba(0,0,0,0.5); border-radius: 50%; padding: 0.8rem;"></button>
        </div>
        <div class="modal-body p-4 pt-5" id="projectDetailsContent">
          <!-- Content injected by JS -->
          <div class="text-center mt-4">
            <div class="spinner-border text-light" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>


  <!-- About Popup -->
  <div id="aboutPopup" class="about-popup-backdrop">
    <div class="about-popup-card">
      <div class="about-popup-content">
        <h3>Giuseppe Oliveri</h3>
        <p>Graphic Designer & Illustrator based in Italy.</p>
        <p>Bachelor - Unirsm<br>Master - Isia Urbino</p>
        <p>Specialized in Visual Identity, Motion Design, and Editorial projects.</p>
        <a href="https://www.linkedin.com/in/giuseppe-oliveri-88a637222/" target="_blank" rel="noopener noreferrer"
          class="linkedin-btn">
          <i data-feather="linkedin"></i>
        </a>
      </div>
    </div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/feather-icons"></script>
  <script src="script.js"></script>


</body>

</html>
